[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "radiogrampy"
version = "0.2.1"
description = "Direct MFSK32/MFSK64 decoder and native PCM WAV encoder"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sam Elsamman" }]
dependencies = [
    "jsonschema>=4.18",
    "numpy",
    "Pillow",
    "scipy",
]

[project.urls]
Documentation = "https://github.com/selsamman/GramPy/tree/master/docs"
Source = "https://github.com/selsamman/GramPy/tree/master"

[project.scripts]
mfsk-iq-decode = "grampy.cli:main"
mfsk-accuracy = "grampy.accuracy_cli:main"
mfsk-fixture-inventory = "grampy.fixture_cli:main"
mfsk-corpus = "grampy.corpus_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grampy = ["py.typed", "data/*.json", "schemas/*.json"]
