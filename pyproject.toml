[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radiogrampy"
version = "0.1.0"
description = "Direct MFSK IQ decoder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GramPy contributors" }]
dependencies = [
    "jsonschema>=4.18",
    "numpy",
    "scipy",
]

[project.scripts]
mfsk-iq-decode = "grampy.cli:main"
mfsk-accuracy = "grampy.accuracy_cli:main"
mfsk-fixture-inventory = "grampy.fixture_cli:main"
mfsk-corpus = "grampy.corpus_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grampy = ["py.typed", "data/*.json", "schemas/*.json"]
