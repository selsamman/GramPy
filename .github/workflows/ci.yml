name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create the repository virtual environment
        run: python -m venv .venv

      - name: Install GramPy and test dependencies
        run: .venv/bin/python -m pip install --upgrade pip pillow .

      - name: Run corpus-independent regression suite
        run: PYTHONPATH="$PWD/src" PATH="$PWD/.venv/bin:$PATH" .venv/bin/python -m unittest discover -s tests

  build:
    name: Build and install distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create the repository virtual environment
        run: python -m venv .venv

      - name: Build source and wheel distributions
        run: .venv/bin/python -m pip install --upgrade pip build && .venv/bin/python -m build

      - name: Inspect source distribution
        run: .venv/bin/python -m tarfile -l dist/*.tar.gz

      - name: Install and verify the built wheel in a clean environment
        run: |
          wheel_environment="$(mktemp -d)"
          python -m venv "$wheel_environment"
          "$wheel_environment/bin/python" -m pip install dist/*.whl
          cd "$wheel_environment"
          "$wheel_environment/bin/python" -c '
          from importlib.metadata import version
          from grampy.resources import load_json
          assert version("radiogrampy")
          assert load_json("schemas", "mfsk-decode-manifest-v1.json")["$schema"]
          '
